<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inputlog General Analysis Prototype</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font: 16px system-ui, sans-serif; color: #202124; background: #fff; }
        header { padding: 16px 20px; border-bottom: 1px solid #ccc; }
        h1 { margin: 0 0 16px; font-size: 22px; }
        .controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
        label { display: flex; align-items: center; gap: 8px; }
        input[type=number] { width: 95px; padding: 6px; font: inherit; }
        button, select { padding: 8px 12px; font: inherit; }
        input[type=file] { max-width: 100%; }
        #status { padding: 12px 20px; white-space: pre-wrap; }
        #warnings { padding: 0 20px 12px; color: #84400b; }
        .table-wrap { overflow: auto; max-height: 70vh; border-top: 1px solid #ccc; }
        table { border-collapse: collapse; font: 13px ui-monospace, monospace; width: 100%; }
        th, td { padding: 7px 10px; border-bottom: 1px solid #ddd; text-align: left; white-space: pre; }
        th { position: sticky; top: 0; background: #f1f3f4; }
        tr:nth-child(even) { background: #f8f9fa; }
    </style>
</head>
<body>
    <header>
        <h1>Inputlog General Analysis Prototype</h1>
        <div class="controls">
            <input id="files" type="file" accept=".idfx,.xml" multiple aria-label="Open IDFX files">
            <select id="selected" aria-label="Recording" hidden></select>
            <label>Intervals <input id="count" type="number" min="1" step="1" value="10"></label>
            <label>Interval ms <input id="size" type="number" min="1" step="1" value="60000"></label>
            <label><input id="simple" type="checkbox">Approximate pause labels</label>
            <button id="tsv" disabled>Export TSV</button>
            <button id="json" disabled>Export JSON</button>
        </div>
    </header>
    <div id="status" role="status">Open an IDFX recording.</div>
    <div id="warnings"></div>
    <div class="table-wrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div>
    <script src="idfx_reader.js"></script>
    <script src="general_analysis.js"></script>
    <script src="prototype.js"></script>
</body>
</html>
